name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs anteriores do mesmo branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── API: type-check ──────────────────────────────────────────────────────────
  check-api:
    name: "API — type-check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

  # ── Web: type-check + build ──────────────────────────────────────────────────
  check-web:
    name: "Web — type-check + build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build (Vite)
        run: npm run build
        env:
          # Valores de CI — a build valida que não há erros mesmo sem credenciais reais
          VITE_API_URL: https://api.sindiride.railway.app
          VITE_SOCKET_URL: https://api.sindiride.railway.app
          VITE_FIREBASE_API_KEY: ""
          VITE_FIREBASE_AUTH_DOMAIN: ""
          VITE_FIREBASE_PROJECT_ID: ""
          VITE_FIREBASE_STORAGE_BUCKET: ""
          VITE_FIREBASE_MESSAGING_SENDER_ID: ""
          VITE_FIREBASE_APP_ID: ""
          VITE_FIREBASE_VAPID_KEY: ""

  # ── Docker build validation (API) ─────────────────────────────────────────────
  docker-api:
    name: "Docker — API production build"
    runs-on: ubuntu-latest
    needs: check-api
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Docker build validation (Web) ─────────────────────────────────────────────
  docker-web:
    name: "Docker — Web production build"
    runs-on: ubuntu-latest
    needs: check-web
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          target: production
          push: false
          build-args: |
            VITE_API_URL=https://api.sindiride.railway.app
            VITE_SOCKET_URL=https://api.sindiride.railway.app
          cache-from: type=gha
          cache-to: type=gha,mode=max
