server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Assets com hash no nome (Vite) podem cachear "pra sempre"
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA — qualquer rota que não seja um arquivo estático cai no index.html,
  # pro React Router cuidar do roteamento no cliente
  location / {
    try_files $uri $uri/ /index.html;
  }
}
