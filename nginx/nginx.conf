server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css application/json
        application/javascript text/javascript
        image/svg+xml application/font-woff application/font-woff2;

    # Assets com hash no nome — cache agressivo (1 ano)
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML nunca cacheado — SPA precisa sempre da versão mais recente
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA routing — qualquer rota que não existe no disco serve o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
